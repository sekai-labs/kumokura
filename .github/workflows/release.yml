name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            archive_format: tar.gz
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            archive_format: tar.gz
          - os: windows-latest
            goos: windows
            goarch: amd64
            archive_format: zip
          - os: macos-latest
            goos: darwin
            goarch: arm64
            archive_format: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Linux GUI dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libwayland-dev libxkbcommon-dev
      - name: Build binaries (Unix)
        if: matrix.goos != 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          mkdir -p dist
          TAGS_FLAG=""
          if [ "${{ matrix.goos }}" = "linux" ]; then
            TAGS_FLAG="-tags wayland"
          fi
          go build -o dist/kumokura ./cmd/kumokura
          go build -o dist/kumokura-tui ./cmd/kumokura-tui
          go build $TAGS_FLAG -o dist/kumokura-desktop ./cmd/kumokura-desktop

      - name: Build binaries (Windows)
        if: matrix.goos == 'windows'
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 1
        shell: bash
        run: |
          mkdir -p dist
          go build -o dist/kumokura.exe ./cmd/kumokura
          go build -o dist/kumokura-tui.exe ./cmd/kumokura-tui
          go build -o dist/kumokura-desktop.exe ./cmd/kumokura-desktop

      - name: Package archive (Unix)
        if: matrix.archive_format == 'tar.gz'
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          ARCHIVE_NAME="kumokura_${TAG_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          tar -czf "${ARCHIVE_NAME}" -C dist kumokura kumokura-tui kumokura-desktop
          mkdir -p release-artifacts
          mv "${ARCHIVE_NAME}" release-artifacts/

      - name: Package archive (Windows)
        if: matrix.archive_format == 'zip'
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          ARCHIVE_NAME="kumokura_${TAG_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          mkdir -p release-artifacts
          cd dist
          7z a "../release-artifacts/${ARCHIVE_NAME}" kumokura.exe kumokura-tui.exe kumokura-desktop.exe

      - name: Install WiX Toolset (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix || true

      - name: Build Windows MSI installer
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $Tag = "${{ github.ref_name }}"
          ./packaging/windows/build-msi.ps1 -Version "$Tag" -DistDir "dist" -OutputDir "release-artifacts"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-artifacts/*


  package-arch:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for build
        run: |
          pacman -Syu --noconfirm --needed go git libglvnd libx11 libxcursor libxrandr libxinerama libxi libxxf86vm wayland libxkbcommon wayland-protocols

      - name: Prepare unprivileged build user
        run: |
          useradd -m -G wheel builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Generate Arch PKGBUILD for prebuilt package
        run: |
          TAG_NAME="${GITHUB_REF_NAME#v}"
          cd packaging/arch
          # Update pkgver in PKGBUILD to match tag
          sed -i "s/^pkgver=.*/pkgver=${TAG_NAME}/" PKGBUILD
          # We are building inside the checked-out repo directly:
          # Adjust source in PKGBUILD or build local directory
          cat << 'EOF' > PKGBUILD.local
          pkgname=kumokura
          pkgver=LOCALVER
          pkgrel=1
          pkgdesc="High-performance, cross-cloud S3 storage manager in Go with CLI, TUI, and Desktop GUI"
          arch=('x86_64')
          url="https://github.com/sekai-labs/kumokura"
          license=('MIT')
          depends=('glibc' 'libglvnd' 'libx11' 'libxcursor' 'libxrandr' 'libxinerama' 'libxi' 'libxxf86vm' 'wayland' 'libxkbcommon')
          optdepends=('libsecret: OS keyring credentials storage on GNOME/FreeDesktop')

          package() {
              install -Dm755 "$REPO_ROOT/dist/kumokura" "$pkgdir/usr/bin/kumokura"
              install -Dm755 "$REPO_ROOT/dist/kumokura-tui" "$pkgdir/usr/bin/kumokura-tui"
              install -Dm755 "$REPO_ROOT/dist/kumokura-desktop" "$pkgdir/usr/bin/kumokura-desktop"
              install -Dm644 "$REPO_ROOT/packaging/arch/kumokura.desktop" "$pkgdir/usr/share/applications/kumokura.desktop"
              install -Dm644 "$REPO_ROOT/packaging/arch/kumokura.svg" "$pkgdir/usr/share/icons/hicolor/scalable/apps/kumokura.svg"
              if [ -f "$REPO_ROOT/LICENSE" ]; then
                  install -Dm644 "$REPO_ROOT/LICENSE" "$pkgdir/usr/share/licenses/$pkgname/LICENSE"
              fi
          }
          EOF
          sed -i "s/LOCALVER/${TAG_NAME}/" PKGBUILD.local

      - name: Download Linux amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: artifacts-linux-amd64
          path: artifacts-linux-amd64

      - name: Unpack Linux binaries and assemble Arch package
        run: |
          mkdir -p dist
          tar -xzf artifacts-linux-amd64/*.tar.gz -C dist
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "export REPO_ROOT='$GITHUB_WORKSPACE'; cd '$GITHUB_WORKSPACE/packaging/arch'; makepkg -p PKGBUILD.local --nodeps -f"
          mkdir -p "$GITHUB_WORKSPACE/release-arch"
          cp packaging/arch/*.pkg.tar.zst "$GITHUB_WORKSPACE/release-arch/"
      - name: Upload Arch Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-arch-linux
          path: release-arch/*

  release:
    needs: [build, package-arch]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Copy Windows installer script to release assets
        run: |
          cp packaging/windows/install.ps1 release-artifacts/install-windows.ps1

      - name: Generate SHA256 checksums
        working-directory: release-artifacts
        run: |
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
          token: ${{ secrets.GITHUB_TOKEN }}
